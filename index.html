<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBUF — Memory-Based UI Framework</title>
  <link rel="stylesheet" href="./examples/shared.css" />
  <style>
    body {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 16px;
    }
    header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 24px;
      margin-bottom: 24px;
    }
    .header-badge {
      display: inline-block;
      font-size: 11px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .tagline {
      color: var(--text-secondary);
      font-size: 16px;
      max-width: 720px;
    }
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 6px 14px;
      font-size: 14px;
    }
    .tab-btn.active {
      background: var(--bg-secondary);
      border-color: var(--border-color);
      color: #fff;
    }
    .compiler-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    textarea {
      width: 100%;
      height: 280px;
      background: #090d13;
      border: 1px solid var(--border-color);
      color: #7dd3fc;
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 12px;
      border-radius: 6px;
      resize: vertical;
    }
    pre {
      background: #090d13;
      border: 1px solid var(--border-color);
      color: #a7f3d0;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      max-height: 280px;
    }
    .memory-inspector {
      margin-top: 32px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }
    .inspector-title {
      font-size: 13px;
      font-family: var(--font-mono);
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-secondary);
    }
    .stat-val {
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-badge">Independent Architecture</div>
    <h1>MBUF — Memory-Based UI Framework</h1>
    <p class="tagline">
      A fine-grained UI execution runtime powered by indexed memory cells, generational handle validation, and targeted DOM updates.
    </p>
  </header>

  <nav class="nav-tabs" id="navTabs">
    <button class="tab-btn active" data-tab="counter">Counter</button>
    <button class="tab-btn" data-tab="todo">Todo App</button>
    <button class="tab-btn" data-tab="table">Data Table</button>
    <button class="tab-btn" data-tab="dashboard">Live Dashboard</button>
    <button class="tab-btn" data-tab="form">Form Validation</button>
    <button class="tab-btn" data-tab="cart">Shopping Cart</button>
    <button class="tab-btn" data-tab="compiler">Live .mbuf Compiler</button>
  </nav>

  <main id="appContainer"></main>

  <!-- Live Memory Engine Inspector -->
  <footer class="memory-inspector">
    <div class="inspector-title">
      <span>Active Memory Engine Telemetry</span>
      <button id="btnToggleDevTools" class="btn" style="padding: 2px 8px; font-size: 11px;">Toggle Floating DevTools</button>
    </div>
    <div class="stats-row" id="memoryStatsRow">
      <div>Capacity: <span class="stat-val" id="statCapacity">-</span></div>
      <div>Allocated Cells: <span class="stat-val" id="statAllocated">-</span></div>
      <div>Free Slots: <span class="stat-val" id="statFree">-</span></div>
      <div>Total Mutations: <span class="stat-val" id="statWrites">-</span></div>
    </div>
  </footer>

  <script type="module">
    import { memory, ui, devtools } from "./packages/mbuf/src/index.ts";
    import { CounterApp } from "./examples/counter/app.ts";
    import { TodoApp } from "./examples/todo/app.ts";
    import { DataTableApp } from "./examples/datatable/app.ts";
    import { DashboardApp } from "./examples/dashboard/app.ts";
    import { FormApp } from "./examples/form/app.ts";
    import { CartApp } from "./examples/cart/app.ts";
    import { compile } from "./packages/compiler/src/index.ts";

    const container = document.getElementById("appContainer");
    let currentUnmount = null;

    const DEFAULT_DSL = `app SampleCounter {
    memory count = 0

    element h1 {
        text: "Count: {count}"
    }

    element button {
        text: "Increment"
        onClick {
            count = count + 1
        }
    }
}`;

    function renderCompilerTab() {
      container.innerHTML = `
        <div class="example-card" style="max-width: 100%;">
          <h2>Interactive .mbuf Compiler</h2>
          <p style="color: var(--text-secondary); font-size: 14px;">
            Edit the declarative DSL on the left to see the Lexer, Parser, and Code Generator output in real-time.
          </p>
          <div class="compiler-grid">
            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">.mbuf DSL Source</label>
              <textarea id="dslInput">${DEFAULT_DSL}</textarea>
            </div>
            <div>
              <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Compiled JavaScript</label>
              <pre id="compiledOutput"></pre>
            </div>
          </div>
        </div>
      `;

      const input = document.getElementById("dslInput");
      const output = document.getElementById("compiledOutput");

      function updateCompile() {
        try {
          const res = compile(input.value);
          output.textContent = res.code;
          output.style.borderColor = "var(--border-color)";
        } catch (e) {
          output.textContent = "Compilation Error:\\n" + e.message;
          output.style.borderColor = "var(--color-danger)";
        }
      }

      input.addEventListener("input", updateCompile);
      updateCompile();
    }

    function switchTab(tab) {
      if (currentUnmount) {
        currentUnmount();
        currentUnmount = null;
      }
      container.innerHTML = "";

      if (tab === "counter") {
        currentUnmount = ui.mount(CounterApp(), container);
      } else if (tab === "todo") {
        currentUnmount = ui.mount(TodoApp(), container);
      } else if (tab === "table") {
        currentUnmount = ui.mount(DataTableApp(), container);
      } else if (tab === "dashboard") {
        currentUnmount = ui.mount(DashboardApp(), container);
      } else if (tab === "form") {
        currentUnmount = ui.mount(FormApp(), container);
      } else if (tab === "cart") {
        currentUnmount = ui.mount(CartApp(), container);
      } else if (tab === "compiler") {
        renderCompilerTab();
      }
    }

    // Tab buttons
    document.getElementById("navTabs").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab-btn");
      if (!btn) return;
      document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      switchTab(btn.dataset.tab);
    });

    // Default mount
    switchTab("counter");

    // Telemetry polling
    setInterval(() => {
      const stats = memory.stats();
      document.getElementById("statCapacity").textContent = stats.capacity;
      document.getElementById("statAllocated").textContent = stats.allocated;
      document.getElementById("statFree").textContent = stats.freeSlots;
      document.getElementById("statWrites").textContent = stats.totalWrites;
    }, 250);

    // Floating DevTools Panel Toggle
    let devToolsElement = null;
    document.getElementById("btnToggleDevTools").addEventListener("click", () => {
      if (devToolsElement) {
        devToolsElement.remove();
        devToolsElement = null;
      } else {
        devToolsElement = devtools.createDevToolsPanel();
        document.body.appendChild(devToolsElement);
      }
    });
  </script>
</body>
</html>
